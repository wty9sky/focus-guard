<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F6FF"/>
      <stop offset="0.55" stop-color="#FAFBFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FF7D6B"/>
      <stop offset="1" stop-color="#E8402F"/>
    </linearGradient>
    <linearGradient id="shieldSoft" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FF9A8C"/>
      <stop offset="1" stop-color="#F53F3F"/>
    </linearGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#1D2129" flood-opacity="0.10"/>
    </filter>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  <circle cx="1200" cy="40" r="260" fill="#F53F3F" opacity="0.07" filter="url(#blurSoft)"/>
  <circle cx="80" cy="760" r="200" fill="#165DFF" opacity="0.06" filter="url(#blurSoft)"/>

  <!-- 左侧：品牌 -->
  <g transform="translate(72,96)">
    <path d="M28 2 L52 12 V32 C52 46 41 56 28 63 C15 56 4 46 4 32 V12 Z" fill="url(#shield)"/>
    <path d="M18 31 L25 39 L38 24" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="152" y="138" font-size="52" font-weight="700" fill="#1D2129" letter-spacing="1">专注守门员</text>
  <text x="154" y="176" font-size="19" letter-spacing="5" fill="#86909C">FOCUS GUARD</text>

  <!-- 左侧：主文案 -->
  <text x="72" y="292" font-size="36" font-weight="600" fill="#1D2129">拦抖音、短剧这类</text>
  <text x="72" y="344" font-size="36" font-weight="600" fill="#1D2129">一刷就停不下来的网站</text>

  <text x="72" y="414" font-size="21" fill="#4E5969">不硬封，只让「点开」这件事变麻烦：</text>
  <text x="72" y="448" font-size="21" fill="#4E5969">先看清代价，再干等 10 秒；忍住不看就加分。</text>

  <!-- 左侧：特性胶囊 -->
  <g font-size="19" fill="#165DFF">
    <rect x="72" y="500" width="146" height="46" rx="23" fill="#E8F0FF"/>
    <text x="100" y="530">定时屏蔽</text>

    <rect x="234" y="500" width="190" height="46" rx="23" fill="#FFECE8"/>
    <text x="262" y="530" fill="#F53F3F">10 秒冷静期</text>

    <rect x="440" y="500" width="190" height="46" rx="23" fill="#E8FFEA"/>
    <text x="468" y="530" fill="#00A32A">积分换奖励</text>
  </g>

  <!-- 左侧：底部说明 -->
  <text x="72" y="660" font-size="18" fill="#4E5969">屏蔽期间每分钟 +1 分，攒够换一集剧、一杯奶茶</text>
  <text x="72" y="712" font-size="17" fill="#86909C">数据只存在本地浏览器 · 不联网 · 不上传</text>

  <!-- 右侧：拦截页示意卡片 -->
  <g filter="url(#cardShadow)">
    <rect x="712" y="96" width="512" height="608" rx="28" fill="#FFFFFF"/>
  </g>

  <!-- 卡片内：盾牌 -->
  <circle cx="968" cy="196" r="38" fill="#FFECE8"/>
  <g transform="translate(952,180) scale(1.14)">
    <path d="M14 1 L26 6 V16 C26 23 20.5 28 14 31.5 C7.5 28 2 23 2 16 V6 Z" fill="url(#shieldSoft)"/>
    <path d="M9 15.5 L12.5 19.5 L19 12" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 卡片内：标题 -->
  <text x="968" y="292" font-size="25" font-weight="600" fill="#1D2129" text-anchor="middle">这个网站已被暂时屏蔽</text>
  <text x="968" y="322" font-size="17" fill="#86909C" text-anchor="middle">douyin.com</text>

  <!-- 卡片内：倒计时 -->
  <text x="968" y="422" font-size="76" font-weight="700" fill="#F53F3F" text-anchor="middle" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif">24:00</text>
  <text x="968" y="456" font-size="17" fill="#86909C" text-anchor="middle">距离解除屏蔽还剩</text>

  <line x1="792" y1="492" x2="1144" y2="492" stroke="#F2F3F5" stroke-width="2"/>

  <!-- 卡片内：代价清单 -->
  <g font-size="19">
    <text x="792" y="534" fill="#4E5969">扣除积分</text>
    <text x="1144" y="534" fill="#F53F3F" font-weight="600" text-anchor="end">-120 分</text>

    <text x="792" y="576" fill="#4E5969">进入冷却</text>
    <text x="1144" y="576" fill="#1D2129" font-weight="600" text-anchor="end">30 分钟</text>

    <text x="792" y="618" fill="#4E5969">连胜清零</text>
    <text x="1144" y="618" fill="#1D2129" font-weight="600" text-anchor="end">4 天 → 0</text>
  </g>

  <!-- 卡片内：按钮 -->
  <rect x="792" y="646" width="352" height="48" rx="10" fill="#F53F3F" opacity="0.12"/>
  <text x="968" y="676" font-size="18" fill="#C9321F" text-anchor="middle">冷静 10 秒后可确认</text>
</svg>
